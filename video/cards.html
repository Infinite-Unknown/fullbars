<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>FullBars video cards</title>
<style>
  @font-face {
    font-family: 'Archivo Variable';
    src: url('/node_modules/@fontsource-variable/archivo/files/archivo-latin-wdth-normal.woff2') format('woff2-variations');
    font-weight: 100 900;
    font-stretch: 62% 125%;
  }
  :root { --ink: #121417; --paper: #f4f5f2; --cobalt: #0b3bf5; --vermilion: #ff4a1c; --ease: cubic-bezier(0.23, 1, 0.32, 1); }
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1920px; height: 1080px; overflow: hidden; font-family: 'Archivo Variable', sans-serif; }
  body { background: transparent; }
  .card { position: absolute; inset: 0; display: none; }
  body[data-card='hook'] #hook, body[data-card='logo'] #logo, body[data-card='close'] #logo, body[data-card='why'] #why, body[data-card='cap'] #cap { display: block; }

  /* hook: the bars fall away */
  #hook { background: var(--ink); color: #fff; }
  #hook .glyph { position: absolute; left: 50%; top: 300px; transform: translateX(-50%); display: flex; align-items: flex-end; gap: 22px; height: 260px; }
  #hook .glyph i { display: block; width: 58px; border-radius: 8px; background: #fff; }
  #hook .glyph i:nth-child(1) { height: 80px; animation: last 600ms var(--ease) 2100ms both; }
  #hook .glyph i:nth-child(2) { height: 140px; animation: drop 500ms var(--ease) 1500ms both; }
  #hook .glyph i:nth-child(3) { height: 200px; animation: drop 500ms var(--ease) 1050ms both; }
  #hook .glyph i:nth-child(4) { height: 260px; animation: drop 500ms var(--ease) 600ms both; }
  @keyframes drop { to { background: #2b3038; transform: translateY(14px); } }
  @keyframes last { to { background: var(--vermilion); } }
  #hook h1 { position: absolute; left: 0; right: 0; text-align: center; font-weight: 800; font-stretch: 118%; letter-spacing: -0.03em; }
  #hook .l1 { top: 650px; font-size: 76px; animation: rise 600ms var(--ease) 2500ms both; }
  #hook .l2 { top: 750px; font-size: 76px; animation: rise 600ms var(--ease) 3500ms both; }
  #hook .l2 em { font-style: normal; color: var(--vermilion); }
  @keyframes rise { from { opacity: 0; transform: translateY(24px); filter: blur(6px); } to { opacity: 1; transform: none; filter: none; } }

  /* logo + close */
  #logo { background: var(--cobalt); color: #fff; }
  #logo .lockup { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -62%); display: flex; align-items: center; gap: 44px; }
  #logo svg { width: 220px; height: 220px; overflow: visible; }
  #logo svg path { stroke-dasharray: 60; stroke-dashoffset: 60; animation: draw 700ms var(--ease) 150ms forwards; }
  #logo svg rect { transform-box: fill-box; transform-origin: bottom; animation: grow 520ms var(--ease) both; }
  #logo svg rect:nth-of-type(1) { animation-delay: 650ms; }
  #logo svg rect:nth-of-type(2) { animation-delay: 740ms; }
  #logo svg rect:nth-of-type(3) { animation-delay: 830ms; }
  #logo svg rect:nth-of-type(4) { animation-delay: 920ms; }
  @keyframes draw { to { stroke-dashoffset: 0; } }
  @keyframes grow { from { transform: scaleY(0.05); opacity: 0; } to { transform: none; opacity: 1; } }
  #logo .word { font-size: 196px; font-weight: 800; font-stretch: 125%; letter-spacing: -0.035em; animation: rise 700ms var(--ease) 1000ms both; }
  #logo .tag { position: absolute; left: 0; right: 0; top: 700px; text-align: center; font-size: 52px; font-weight: 600; color: #dbe3ff; animation: rise 600ms var(--ease) 1500ms both; }
  body[data-card='close'] #logo .tag { font-weight: 800; font-stretch: 115%; color: #fff; font-size: 64px; }

  /* why */
  #why { background: var(--paper); color: var(--ink); }
  #why ul { list-style: none; padding: 0; position: absolute; left: 240px; top: 280px; display: grid; gap: 36px; }
  #why li { font-size: 104px; font-weight: 800; font-stretch: 120%; letter-spacing: -0.035em; line-height: 1; animation: rise 600ms var(--ease) both; display: flex; align-items: center; gap: 40px; }
  #why li:nth-child(1) { animation-delay: 200ms; }
  #why li:nth-child(2) { animation-delay: 1600ms; }
  #why li:nth-child(3) { animation-delay: 3000ms; font-size: 72px; color: var(--cobalt); }
  #why li b { width: 28px; height: 28px; border-radius: 6px; background: var(--cobalt); flex: none; }

  /* caption lower third (exported as transparent PNG) */
  #cap .box { position: absolute; left: 50%; bottom: 72px; transform: translateX(-50%); max-width: 1500px; padding: 22px 40px; border-radius: 18px; background: rgb(18 20 23 / 0.88); color: #fff; font-size: 44px; font-weight: 600; line-height: 1.3; text-align: center; letter-spacing: -0.005em; }
</style>
</head>
<body>
  <section class="card" id="hook">
    <div class="glyph"><i></i><i></i><i></i><i></i></div>
    <h1 class="l1">Your Wi-Fi isn't slow.</h1>
    <h1 class="l2">Your router is in the <em>wrong place.</em></h1>
  </section>

  <section class="card" id="logo">
    <div class="lockup">
      <svg viewBox="0 0 32 32" aria-hidden="true">
        <path d="M4.5 3v24.5H29" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="square"/>
        <rect x="9.5" y="19" width="3.4" height="5" rx="0.6" fill="#fff"/>
        <rect x="14.5" y="15" width="3.4" height="9" rx="0.6" fill="#fff"/>
        <rect x="19.5" y="11" width="3.4" height="13" rx="0.6" fill="#fff"/>
        <rect x="24.5" y="7" width="3.4" height="17" rx="0.6" fill="#9db1ff"/>
      </svg>
      <span class="word">FullBars</span>
    </div>
    <p class="tag" id="tag">See your Wi-Fi through the walls.</p>
  </section>

  <section class="card" id="why">
    <ul>
      <li><b></b>Free.</li>
      <li><b></b>Nothing to install.</li>
      <li><b></b>Your floor plan never leaves your browser.</li>
    </ul>
  </section>

  <section class="card" id="cap"><div class="box" id="cap-text"></div></section>

<script>
  const q = new URLSearchParams(location.search);
  document.body.dataset.card = q.get('card') || 'hook';
  if (q.get('card') === 'close') document.getElementById('tag').textContent = 'Move it once. Get it right.';
  if (q.get('cap')) document.getElementById('cap-text').textContent = q.get('cap');
</script>
</body>
</html>
